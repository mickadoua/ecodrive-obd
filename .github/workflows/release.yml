name: Release

# Builds the signed off-store APK for every version tag and attaches it to the GitHub release,
# with its SHA-256. Approved by the maintainer on 15/11/2026 (APK built by GitHub CI, no build on
# a private machine). A tag with a suffix (v0.2.0-rc.1) gives a draft release: a dry run that
# publishes nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

# One group per tag: two versions never cancel each other; a re-pushed tag cancels its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # versionCode = number of commits: a shallow clone would give a number too low
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      # The off-store key (ECODRIVE_APK_*) is not the Play upload key: Play re-signs what it
      # distributes, so the store app and this APK never share a signature anyway.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ECODRIVE_APK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ECODRIVE_APK_KEYSTORE_BASE64 missing: cannot sign the APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Signed APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ECODRIVE_APK_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ECODRIVE_APK_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ECODRIVE_APK_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ecodrive-obd.apk
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Signature and checksum
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "$apksigner"
          "$apksigner" verify --verbose --print-certs ecodrive-obd.apk > apksigner.txt 2>&1 || { cat apksigner.txt; exit 1; }
          grep -E "Verified using|certificate (DN|SHA-256 digest):" apksigner.txt || { cat apksigner.txt; exit 1; }
          sha256sum ecodrive-obd.apk > ecodrive-obd.apk.sha256
          cat ecodrive-obd.apk.sha256
      # Fixed asset name: releases/latest/download/ecodrive-obd.apk stays valid from one version to the next.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=()
          case "$GITHUB_REF_NAME" in *-*) draft=(--draft) ;; esac
          gh release create "$GITHUB_REF_NAME" ecodrive-obd.apk ecodrive-obd.apk.sha256 \
            "${draft[@]}" --title "EcoDrive OBD $GITHUB_REF_NAME" --generate-notes
